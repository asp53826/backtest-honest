[project]
name = "backtest-honest"
version = "0.1.0"
description = "A backtester that measures its own selection bias: purged CV and deflated Sharpe, calibrated on data with no signal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a few thousand simulations"]
